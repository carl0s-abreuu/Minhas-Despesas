<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nova Categoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav>
        <h2>Minhas Despesas $</h2>
        <a href="index.html">Início</a>
        <a href="categorias.html">Categorias</a>
        <a href="categoria-form.html">Nova Categoria</a>
        <a href="despesas.html">Despesas</a>
        <a href="despesa-form.html">Nova Despesa</a>
    </nav>

    <div class="container">
        <!-- Jéssica Esteffany e Carlos Antônio q fizeram o form -->
        <h1>Nova Categoria</h1>
        
        <form onsubmit="salvarCategoria(event)">
            <label>Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Alimentação" required>
            
            <label>Descrição</label>
            <input type="text" id="descricao" name="descricao" placeholder="Ex: Mercado, RU, Lanches" required>
            
            <label>Limite de alerta (R$, opcional)</label>
            <input type="number" step="0.01" id="limite" name="limite" placeholder="Ex: 400.00">
            
            <div style="margin-top: 15px;">
                <button type="submit" class="btn-save">Salvar categoria</button>
                <a href="categorias.html" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
